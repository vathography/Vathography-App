# Builds the macOS (Apple silicon) Vathography App zip. Started by hand (Actions -> "Build the macOS app" -> Run
# workflow); nothing runs on a push. No secrets are used and the log is public: it must never carry private data.
# Steps = packaging/build_av_lgpl_mac.py (PyAV on an LGPL-only FFmpeg) -> packaging/build_package_mac.py (the .app,
# signed ad hoc, zipped by ditto) -> packaging/smoke_mac.py (checks on the built zip; the runner has no GPU).
name: Build the macOS app

on:
  workflow_dispatch:
    inputs:
      seed_defect:
        description: "Test run only: break one check on purpose (it must go red). Normal builds: none."
        type: choice
        options: [none, smoke, ffversion, supervisor, decode, window]
        default: none

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-15            # Apple silicon (GitHub retired the arm64 macos-14 image); builds still target macOS 14
    timeout-minutes: 120
    defaults:
      run:
        shell: bash              # = bash -eo pipefail: a failing script before "| tee" fails the step
    env:
      SEED_DEFECT: ${{ inputs.seed_defect }}   # none on every normal build; smoke / ffversion / supervisor / decode / window = must-fire test runs
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          sw_vers
          uname -m
          python3 --version
          xcodebuild -version

      - name: Python for the PyAV build (python-build-standalone 3.10.21 aarch64, the one the app ships)
        run: |
          mkdir -p _build/logs _build/pbs_tool
          TGZ=$(python3 -c "import sys; sys.path.insert(0, 'packaging'); import build_package_mac as M; print(M.fetch_python())")
          tar -xzf "$TGZ" -C _build/pbs_tool

      - name: PyAV on an LGPL-only FFmpeg
        run: python3 packaging/build_av_lgpl_mac.py _build/pbs_tool/python/bin/python3.10 2>&1 | tee _build/logs/build_av_lgpl_mac.log

      - name: The app (.app bundle, signed ad hoc, zipped)
        run: python3 packaging/build_package_mac.py 2>&1 | tee _build/logs/build_package_mac.log

      - name: Smoke checks on the built zip
        run: python3 packaging/smoke_mac.py "$(ls _build/Vathography_App_*_macos*.zip)" _build/cache/wheels_mac 2>&1 | tee _build/logs/smoke_mac.log

      - name: Keep the zip and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: vathography-app-macos
          path: |
            _build/Vathography_App_*_macos*.zip
            _build/mac/Vathography App/BUILD_INFO.json
            _build/logs/
          retention-days: 7
          if-no-files-found: warn
