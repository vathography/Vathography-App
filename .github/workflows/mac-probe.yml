# Memory probe of the depth model's pieces on a GitHub Mac runner (Apple silicon, PyTorch mps). Started by hand
# (Actions -> "Mac memory probe" -> Run workflow); nothing runs on a push; no app build, no secrets; the log is public
# and carries no private data. Script: packaging/mac_probe.py (one item per step, each writes _probe/<item>.json).
name: Mac memory probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: "1"     # as the app sets it on a Mac (cli.py)
      PY: _build/pbs_tool/python/bin/python3.10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Runner
        run: |
          sw_vers
          uname -m
          sysctl -n hw.memsize machdep.cpu.brand_string hw.ncpu

      - name: Python 3.10 (python-build-standalone, the one the app ships) + the app's pinned packages
        run: |
          mkdir -p _build/pbs_tool _probe
          TGZ=$(python3 -c "import sys; sys.path.insert(0, 'packaging'); import build_package_mac as M; print(M.fetch_python())")
          tar -xzf "$TGZ" -C _build/pbs_tool
          sed 's/+cu128//' packaging/constraints.txt > _probe/constraints_mac.txt
          $PY -m pip install --disable-pip-version-check --no-input -c _probe/constraints_mac.txt \
            torch==2.10.0 diffusers==0.38.0 accelerate==1.13.0 safetensors==0.8.0 numpy==2.2.5 2>&1 | tail -n 5

      - name: info (mps available? memory, chip)
        run: $PY packaging/mac_probe.py info --out _probe 2>&1 | tee _probe/info.log

      - name: C1 the VAE on the CPU, float32 (time, peak memory, conv path)
        continue-on-error: true
        run: $PY packaging/mac_probe.py C1 --out _probe 2>&1 | tee _probe/C1.log

      - name: C2 the VAE on mps, bfloat16 (memory per encode / decode)
        continue-on-error: true
        env:
          PYTORCH_DEBUG_MPS_ALLOCATOR: "1"
        run: $PY packaging/mac_probe.py C2 --out _probe 2>&1 | tee _probe/C2.log

      - name: C3 block 1 on mps (copies, nf4 decode, LoRA merge, block run with 4 and 1 heads per call)
        continue-on-error: true
        env:
          PYTORCH_DEBUG_MPS_ALLOCATOR: "1"
        run: $PY packaging/mac_probe.py C3 --out _probe 2>&1 | tee _probe/C3.log

      - name: C4 a real MPS out-of-memory (tiny cap)
        continue-on-error: true
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.05"
          PYTORCH_MPS_LOW_WATERMARK_RATIO: "0.04"
        run: $PY packaging/mac_probe.py C4 --out _probe 2>&1 | tee _probe/C4.log

      - name: C5 lines printed by the allocator debug flag for one empty_cache
        continue-on-error: true
        env:
          PYTORCH_DEBUG_MPS_ALLOCATOR: "1"
        run: |
          $PY packaging/mac_probe.py C5 --out _probe 2> _probe/C5_stderr.log | tee _probe/C5.log
          echo "lines between the markers:"
          awk '/=== C5 empty_cache start ===/{f=1;next}/=== C5 empty_cache end ===/{f=0}f' _probe/C5_stderr.log | tee _probe/C5_lines.txt | wc -l

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: mac-probe
          path: _probe/
          retention-days: 7
          if-no-files-found: warn
